name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ${{ vars.REGISTRY }}/qwen-serve
  NAMESPACE: ai-inference
  RELEASE: qwen-llm

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: python -m py_compile app/serve_app.py
      - run: helm lint helm/qwen-llm

  build:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.MASTER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.MASTER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy chart to master
        run: |
          ssh $TARGET "rm -rf /tmp/qwen-llm"
          scp -r helm/qwen-llm $TARGET:/tmp/qwen-llm

      - name: Deploy on master
        run: |
          ssh $TARGET bash -s <<EOF
          set -e
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n $NAMESPACE create secret docker-registry regcred \
            --docker-server='${{ vars.REGISTRY }}' \
            --docker-username='${{ secrets.REGISTRY_USERNAME }}' \
            --docker-password='${{ secrets.REGISTRY_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install $RELEASE /tmp/qwen-llm \
            -n $NAMESPACE \
            --set image.repository=$IMAGE \
            --set image.tag=${{ github.sha }} \
            --set 'imagePullSecrets[0].name=regcred'
          EOF

      - name: Smoke test
        run: |
          ssh $TARGET "NAMESPACE=$NAMESPACE bash -s" <<'EOF'
          for i in $(seq 1 90); do
            HEAD=$(kubectl -n $NAMESPACE get pod -l ray.io/node-type=head \
                   --sort-by=.metadata.creationTimestamp -o name | tail -1)
            if kubectl -n $NAMESPACE exec $HEAD -- curl -sf localhost:8000/generate \
                 -H 'Content-Type: application/json' \
                 -d '{"prompt":"Hello","max_new_tokens":8}' | grep -q '"text"'; then
              echo "smoke test OK"; exit 0
            fi
            echo "waiting for service... ($i/90)"; sleep 20
          done
          echo "smoke test FAILED"; exit 1
          EOF